name = "text_encoding"
version = "0.1.0"

description = "The WHATWG Encoding Standard's decoders in pure Gleam: UTF-8, UTF-16, legacy single-byte and CJK encodings"
licences = ["Apache-2.0"]
internal_modules = ["text_encoding/internal", "text_encoding/internal/*"]
repository = { type = "github", user = "Munksgaard", repo = "text_encoding" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
